catalog: movies
schema: public
sql: "SELECT \n    movie_title,\n    source,\n    AVG(rating_value) AS avg_rating,\n\
  \    COUNT(*) AS rating_count\nFROM (\n    SELECT m.title AS movie_title, r.rating_value,\
  \ 'current' AS source\n    FROM movie_rating mr\n    JOIN movie m ON m.movie_id\
  \ = mr.movie_id\n    JOIN rating r ON r.id = mr.rating_id\n\n    UNION ALL\n\n \
  \   SELECT ar.movie_title, ar.rating_value, 'archived' AS source\n    FROM archived_rating\
  \ ar\n) AS combined\nGROUP BY movie_title, source\nORDER BY avg_rating DESC;\n"
