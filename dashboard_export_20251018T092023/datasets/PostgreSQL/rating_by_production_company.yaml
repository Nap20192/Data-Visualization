sql: "SELECT\n    pc.company_name,\n    m.title,\n    r.rating_value,\n    m.popularity,\n\
  \    m.revenue,\n    m.budget,\n    m.release_date\nFROM movie AS m\nLEFT JOIN movie_company\
  \ AS mc ON mc.movie_id = m.movie_id\nLEFT JOIN production_company AS pc ON pc.company_id\
  \ = mc.company_id\nLEFT JOIN movie_rating AS mr ON mr.movie_id = m.movie_id\nRIGHT\
  \ JOIN rating AS r ON r.id = mr.rating_id\nWHERE m.budget > 0 AND m.revenue > 0;\n"
