catalog: movies
schema: public
sql: "SELECT\n    p.person_name AS actor_name,\n    COUNT(DISTINCT m.movie_id) AS\
  \ movies_played,\n    SUM(m.revenue - m.budget) AS total_profit,\n    ROUND(AVG(m.vote_average),\
  \ 2) AS avg_rating\nFROM movie AS m\nJOIN movie_cast AS mc ON mc.movie_id = m.movie_id\n\
  JOIN person AS p ON p.person_id = mc.person_id\nWHERE m.budget > 0 AND m.revenue\
  \ > 0\nGROUP BY p.person_name\nORDER BY total_profit DESC;"
