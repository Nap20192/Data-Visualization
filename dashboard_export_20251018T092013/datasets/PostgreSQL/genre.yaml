sql: "SELECT\n    g.genre_name,\n    m.title,\n    m.budget,\n    m.revenue,\n   \
  \ (m.revenue - m.budget) AS profit,\n    ROUND((m.revenue::numeric / NULLIF(m.budget,\
  \ 0) - 1) * 100, 2) AS roi_percent,\n    m.popularity,\n    m.vote_average,\n  \
  \  m.release_date\nFROM movie AS m\nLEFT JOIN movie_genres AS mg ON mg.movie_id\
  \ = m.movie_id\nLEFT JOIN genre AS g ON g.genre_id = mg.genre_id\nWHERE m.budget\
  \ > 0 AND m.revenue > 0;\n"
