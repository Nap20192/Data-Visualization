sql: "SELECT\n\n    CASE\n        WHEN m.budget < 1000000 THEN 'Ultra Low (<1M)'\n\
  \        WHEN m.budget < 10000000 THEN 'Low (1M\u201310M)'\n        WHEN m.budget\
  \ < 50000000 THEN 'Medium (10M\u201350M)'\n        WHEN m.budget < 100000000 THEN\
  \ 'High (50M\u2013100M)'\n        WHEN m.budget < 200000000 THEN 'Big (100M\u2013\
  200M)'\n        ELSE 'Blockbuster (>200M)'\n    END AS budget_range,\n\n    CASE\n\
  \        WHEN (m.revenue - m.budget) / NULLIF(m.budget, 0) < -0.5 THEN 'Severe Loss\
  \ (<-50%)'\n        WHEN (m.revenue - m.budget) / NULLIF(m.budget, 0) < 0 THEN 'Loss\
  \ (0\u2013-50%)'\n        WHEN (m.revenue - m.budget) / NULLIF(m.budget, 0) < 0.25\
  \ THEN 'Low ROI (0\u201325%)'\n        WHEN (m.revenue - m.budget) / NULLIF(m.budget,\
  \ 0) < 0.5 THEN 'Moderate ROI (25\u201350%)'\n        WHEN (m.revenue - m.budget)\
  \ / NULLIF(m.budget, 0) < 1 THEN 'Good ROI (50\u2013100%)'\n        WHEN (m.revenue\
  \ - m.budget) / NULLIF(m.budget, 0) < 2 THEN 'Very Good ROI (100\u2013200%)'\n \
  \       ELSE 'Excellent ROI (>200%)'\n    END AS roi_range,\n\n    COUNT(*) AS movie_count\n\
  FROM movie AS m\nWHERE m.budget > 0 AND m.revenue > 0\nGROUP BY budget_range, roi_range\n\
  ORDER BY budget_range, roi_range;\n"
