offset: 0
cache_timeout: null
catalog: movies
schema: public
sql: "SELECT\n    c.country_name,\n    m.title,\n    m.budget,\n    m.revenue,\n \
  \   (m.revenue - m.budget) AS profit,\n    ROUND((m.revenue::numeric / NULLIF(m.budget,\
  \ 0) - 1) * 100, 2) AS roi_percent,\n    m.popularity,\n    m.vote_average,\n  \
  \  m.release_date\nFROM movie AS m\nLEFT JOIN production_country AS pcountry ON\
  \ pcountry.movie_id = m.movie_id\nLEFT JOIN country AS c ON c.country_id = pcountry.country_id\n\
  WHERE m.budget > 0 AND m.revenue > 0;\n"
